<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calc</title>
  <meta name="description" content="A modern scientific and graphing calculator that runs in the browser.">
  <!-- CSP hashes cover the two inline scripts below byte-for-byte (LF-normalized by the HTML parser). Recompute if either changes. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-XpQg0CSjQge+3jqeR/xQJw21xvwItEclXC7pnn3gA9o=' 'sha256-Aaty4Ft/rA4yG+IpCU4frHODaCjUzTHQMl2g4gjfaCk='; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/math.js"></script>
  <script type="importmap">
    { "imports": { "mathjs": "./vendor/mathjs.js" } }
  </script>
  <script>
    // Set theme before paint to avoid a flash.
    try {
      const t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <header class="top">
    <h1>Calc</h1>
    <div class="top-actions">
      <button id="theme" class="pill" aria-label="Toggle light and dark theme">Theme</button>
    </div>
  </header>

  <main class="layout">
    <section class="glass calc" aria-label="Calculator">
      <div class="display">
        <div class="annun" aria-hidden="true"><span id="an-angle" class="on">DEG</span><span id="an-mem">M</span></div>
        <label class="sr" for="expr">Expression</label>
        <input id="expr" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
               inputmode="text" placeholder="Type or tap an expression" aria-describedby="result">
        <output id="result" class="result" aria-live="polite">0</output>
        <p class="defined" id="defined" hidden></p>
      </div>
      <div class="memrow" id="memrow" role="group" aria-label="Memory"></div>
      <div class="keys" id="keys" role="group" aria-label="Keypad"></div>
      <p class="hint">Enter = equals · Esc clears · Alt+1–4 memory</p>
    </section>

    <section class="glass sci" id="sci" aria-label="Scientific functions">
      <div class="seg" id="angle" role="radiogroup" aria-label="Angle mode"></div>
      <div id="scikeys"></div>
    </section>

    <aside class="glass history" aria-label="History">
      <div class="hist-head">
        <h2>History</h2>
        <span class="hist-tools" id="histtools"></span>
      </div>
      <ol id="history"></ol>
      <p class="empty" id="histempty">Your calculations appear here. Select one to reuse it.</p>
    </aside>
  </main>

  <section class="glass tools" aria-label="Tools">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panel"></div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
